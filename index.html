<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f7;--surface:#fff;--ink:#122e5e;--muted:#566681;--line:#cdd6e3;--accent:#0071bc;--on-accent:#fff;--warn-bg:#fde8e4;--warn:#a3200f;--ok:#1f7a45;--ph:#dcdad2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#17233a;--ink:#f0eee8;--muted:#9aa3a9;--line:#2c3b57;--warn-bg:#3a1f1a;--warn:#ff9a88;--ok:#5fd08c;--ph:#22324d;--accent:#4aa3e0;--on-accent:#0b1a33}}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#17233a;--ink:#f0eee8;--muted:#9aa3a9;--line:#2c3b57;--warn-bg:#3a1f1a;--warn:#ff9a88;--ok:#5fd08c;--ph:#22324d;--accent:#4aa3e0;--on-accent:#0b1a33}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;line-height:1.05;margin:0}
.head{background:#fff;color:#122e5e;margin:0 -16px;padding:16px 16px 18px;border-bottom:8px solid #0071bc}
.head .logo{display:block;height:58px;width:auto;margin:0 0 14px}
.head small{display:block;color:#0071bc;font-weight:600;font-size:15px;margin-bottom:6px}
.head h1{font-size:44px;font-weight:700;color:#122e5e}
.head p{margin:8px 0 0;color:#566681;font-size:16px}
.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.foot .fl{display:inline-block;background:#fff;border-radius:6px;padding:10px 14px}
.foot img{display:block;height:44px;width:auto}
.foot p{margin:10px 0 0;font-size:14px;color:var(--muted)}
.menu{display:grid;gap:12px;margin-top:20px}
.btn{display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 16px;background:var(--surface);border:2px solid var(--ink);border-radius:6px;color:var(--ink);text-decoration:none;font-weight:600}
.btn:active,.btn:focus-visible{background:var(--accent);color:var(--on-accent);outline:3px solid var(--ink);outline-offset:2px}
.btn svg{flex:none;width:34px;height:34px}
.btn b{display:block;font-family:"Barlow Condensed",Arial,sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.btn span{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.btn:active span,.btn:focus-visible span{color:var(--on-accent)}
.btn.sos{border-color:var(--warn);background:var(--warn-bg)}
.top{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.back{font:600 17px Barlow,sans-serif;background:none;border:2px solid var(--ink);color:var(--ink);border-radius:6px;padding:10px 14px;min-height:48px;cursor:pointer}
.meta{color:var(--muted);font-size:15px;margin:0 0 12px}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.prog p{margin:6px 0 0;font-size:15px;font-weight:600}
.step{background:var(--surface);border:2px solid var(--line);border-radius:6px;margin-top:16px;overflow:hidden}
.step.done{border-color:var(--ok)}
.photo{aspect-ratio:4/3;background:var(--ph);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:15px;border-bottom:2px solid var(--line)}
.pic{display:block;width:100%;height:auto;max-height:80vh;object-fit:contain;background:var(--ph);border-bottom:2px solid var(--line)}
.photo svg{width:44px;height:44px;opacity:.7}
.body{padding:14px 16px 16px}
.body h3{font-size:28px;font-weight:700;margin-bottom:6px}
.body p{margin:0 0 10px}
.warn{background:var(--warn-bg);color:var(--warn);border-left:6px solid var(--warn);padding:10px 12px;font-weight:600;font-size:16px;margin:0 0 10px;border-radius:0 4px 4px 0}
.how{margin:0 0 12px;padding-left:26px}
.how li{margin-bottom:8px}
.chk{display:flex;align-items:center;gap:12px;min-height:56px;font-weight:600;cursor:pointer;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.chk input{width:30px;height:30px;accent-color:var(--ok);flex:none}
.finish{margin-top:20px;padding:18px;border:2px dashed var(--ok);border-radius:6px;text-align:center;font-weight:600;color:var(--ok);display:none}
.finish.show{display:block}
.note{margin-top:28px;font-size:14px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
</style>
</head>

var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function head(){return '<header class="head"><img class="logo" src="'+LOGO+'" alt="Anord Mardix, a Flex company">'+(MACHINE.location?'<small>'+esc(MACHINE.location)+'</small>':'')+'<h1>'+esc(MACHINE.name)+'</h1>'+(MACHINE.model?'<p>'+esc(MACHINE.model)+'</p>':'')+'</header>'}
function home(){
 var h=head()+'<nav class="menu" aria-label="Guides">';
 ['cleaning','lens'].forEach(function(k){var g=GUIDES[k];
  h+='<a class="btn" href="#'+k+'">'+ic[g.icon]+'<div><b>'+esc(g.title)+'</b><span>'+esc(g.sub)+'</span></div></a>'});
 h+='</nav>';
 
 app.innerHTML=h;
}
function guide(k){
 var g=GUIDES[k],n=g.steps.length;
 var h=head()+'<div class="top"><a class="back" href="#" style="text-decoration:none">‹ Back</a></div>';
 h+='<h2 style="font-size:34px">'+esc(g.title)+'</h2><p class="meta">'+esc(g.sub)+'</p>';
 h+='<div class="prog"><div class="bar"><i id="fill"></i></div><p id="count">0 of '+n+' steps done</p></div>';
 g.steps.forEach(function(s,i){
  h+='<section class="step" id="s'+i+'">'+(s.video?'<video class="pic" src="'+s.video+'" controls playsinline preload="metadata"></video>':s.img?'<img class="pic" src="'+s.img+'" alt="Step '+(i+1)+': '+esc(s.t)+'">':'<div class="photo">'+ic.cam+'<span>'+esc(s.ph||('Photo for step '+(i+1)+' goes here'))+'</span></div>')+'<div class="body"><h3>'+(n>1?'Step '+(i+1)+': ':'')+esc(s.t)+'</h3>';
  if(s.n)h+='<p class="warn">'+esc(s.n)+'</p>';
  if(s.w)h+='<p class="warn">Safety: '+esc(s.w)+'</p>';
  h+='<p>'+esc(s.d)+'</p>'+(s.l?'<ol class="how">'+s.l.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>':'')+'<label class="chk"><input type="checkbox" data-i="'+i+'"> Step done</label></div></section>';
 });
 h+='<div class="finish" id="fin">All steps done. Thank you!</div>';
 app.innerHTML=h;
 var boxes=app.querySelectorAll('input[type=checkbox]');
 boxes.forEach(function(b){b.addEventListener('change',function(){
  document.getElementById('s'+b.dataset.i).classList.toggle('done',b.checked);
  var d=0;boxes.forEach(function(x){if(x.checked)d++});
  document.getElementById('fill').style.width=(d/n*100)+'%';
  document.getElementById('count').textContent=d+' of '+n+' steps done';
  document.getElementById('fin').classList.toggle('show',d===n);
 })});
}
var cur=null;
function show(k){cur=k;window.scrollTo(0,0);if(GUIDES[k])guide(k);else home()}
function route(){var k=location.hash.replace('#','');if(k!==cur)show(k)}
document.addEventListener('click',function(e){
 var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
 e.preventDefault();var k=a.getAttribute('href').slice(1);show(k);
 try{if(location.hash.replace('#','')!==k)location.hash=k}catch(_){}
});
window.addEventListener('hashchange',route);route();
</script>
